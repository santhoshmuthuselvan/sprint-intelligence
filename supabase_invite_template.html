<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
        }

        .email-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
        }

        .logo-badge {
            display: inline-flex;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            width: 48px;
            height: 48px;
            border-radius: 14px;
            margin-bottom: 24px;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #64748b;
            margin: 0 0 32px 0;
        }

        .btn {
            display: block;
            background: #0f172a;
            color: #ffffff !important;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="logo-badge">⚡</div>
        <h1>Almost there!</h1>
        <p>You've been invited to join the <strong>Sprint Intelligence</strong> platform. To get started, please click
            the
            button below to verify your account and set your permanent password.</p>

        <a href="{{ .ConfirmationURL }}" class="btn">Verify & Set Password</a>

        <div class="footer">
            This invite was sent from {{ .SiteURL }}<br>
            The link will automatically expire in 24 hours.
        </div>
    </div>
</body>

</html>
